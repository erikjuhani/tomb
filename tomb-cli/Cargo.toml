[package]
name = "tomb-cli"
version = "0.1.0"
edition = "2024"
authors = ["Erik Kinnunen <erik.kinn@gmail.com>"]
description = "Unearth your buried tasks. A command line task management tool."
homepage = "https://github.com/erikjuhani/tomb"
repository = "https://github.com/erikjuhani/tomb"
license = "GPL-3.0"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
crossterm = "0.29.0"
etcetera = "0.11.0"
rand = "0.10.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.0.6"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
